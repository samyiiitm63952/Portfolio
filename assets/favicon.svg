<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#18140c" />
      <stop offset="60%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#040404" />
    </radialGradient>

    <!-- Gold Brand Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe3b" />
      <stop offset="60%" stop-color="#f0a500" />
      <stop offset="100%" stop-color="#ff6b00" />
    </linearGradient>

    <!-- Blue Ambient Accent Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a9bdc" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Monogram Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a500" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3a9bdc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f0a500" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background Ambient Glow Core -->
  <circle cx="64" cy="64" r="38" fill="#f0a500" opacity="0.12" filter="blur(8px)" />

  <!-- Monogram Group with Glow -->
  <g filter="url(#glow)">
    <!-- 'S' Geometric Cyber Glyph -->
    <path d="M 52 38 
             L 34 38 
             A 6 6 0 0 0 28 44 
             L 28 54 
             A 6 6 0 0 0 34 60 
             L 48 64 
             A 6 6 0 0 1 54 70 
             L 54 84 
             A 6 6 0 0 1 48 90 
             L 30 90" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 'K' Geometric Stem & Chevrons -->
    <!-- K Vertical Stem -->
    <path d="M 68 38 L 68 90" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linecap="round" />

    <!-- K Upper Arm (Gold transitioning to Electric Accent) -->
    <path d="M 70 64 L 98 38" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linecap="round" />

    <!-- K Lower Arm (Electric Cyan/Blue accent matching theme) -->
    <path d="M 72 62 L 100 90" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="8" 
          stroke-linecap="round" />
  </g>

  <!-- Tiny Cyber Diamond Vertex -->
  <polygon points="68,64 72,60 76,64 72,68" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
</svg>
